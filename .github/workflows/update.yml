name: HK TID Update

on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: hk-titledb-${{ github.run_id }}
          restore-keys: hk-titledb-

      - name: Keep repo files
        run: |
          git checkout .cache/enum_dlc_pool.txt
          if [ ! -f output/hk_tid_map.json ]; then rm -f .cache/.hk_state.json; fi

      - name: BASE pipeline
        run: python hk_pipeline.py

      - name: US data
        run: python us_fetch.py

      - name: DLC enum
        run: python enum_dlc.py

      - name: DLC crawl (if new)
        run: |
          if [ -s .cache/hk_dlc_new.json ] && [ "$(cat .cache/hk_dlc_new.json)" != "[]" ]; then
            python crawl_dlc.py
          fi

      - name: Merge
        run: python merge_dlc.py

      - name: Clean cache
        run: rm -f .cache/raw_full.json .cache/hk_api.json .cache/hk_dlc_new.json

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: hk-titledb-${{ github.run_id }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ .cache/.hk_state.json .cache/enum_dlc_pool.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "[CI] $(date +%Y-%m-%d)"
            git push
          fi
