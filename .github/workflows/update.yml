name: HK TID Update v2

on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: hk-v2-${{ github.run_id }}
          restore-keys: hk-v2-

      - name: Keep repo files
        run: git checkout .cache/enum_dlc_pool.txt

      - name: US data (before main)
        run: python us_fetch.py

      - name: Main pipeline
        run: python main.py

      - name: Clean cache
        run: rm -f .cache/raw_full.json .cache/hk_api.json .cache/hk_dlc_new.json .cache/hk_dlc_meta.json

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: hk-v2-${{ github.run_id }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ .cache/enum_dlc_pool.txt .cache/.hk_404.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "[CI] $(date +%Y-%m-%d)"
            git push
          fi
